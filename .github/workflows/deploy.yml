name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Make project scripts executable
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        run: npm ci

      - name: Build and validate artifact
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Deploy Worker and custom domain
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: deploy --config dist/server/wrangler.json --domains ycaura.com --domains www.ycaura.com --domains mps.rabby.cc --message "GitHub Actions ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify public site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --output /tmp/ycaura-home.html https://ycaura.com/
          grep -q '瑪菲斯皮膚覆蓋專家' /tmp/ycaura-home.html
