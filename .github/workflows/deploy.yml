name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_gsc:
        description: "重新提交 sitemap 到 Google Search Console"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Make project scripts executable
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        run: npm ci

      - name: Classify SEO/AEO change
        id: impact
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GSC_FORCE_SUBMIT: ${{ inputs.force_gsc }}
        run: node scripts/classify-seo-aeo-change.mjs --output seo-aeo-impact.json

      - name: Build, lint, and test
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          npm test
          npm run lint

      - name: Validate built SEO/AEO output before deploy
        env:
          SEO_AEO_BASE_URL: http://localhost:1106
          SEO_AEO_CANONICAL_ORIGIN: https://ycaura.com
          SEO_AEO_REPORT_PATH: seo-aeo-predeploy-report.json
        run: |
          PORT=1106 npm run start > /tmp/mps-seo-aeo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:1106/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://localhost:1106/ >/dev/null
          npm run validate:seo-aeo

      - name: Deploy Worker and custom domain
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: deploy --config dist/server/wrangler.json --domains ycaura.com --domains www.ycaura.com --domains mps.rabby.cc --message "GitHub Actions ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify public site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --output /tmp/ycaura-home.html https://ycaura.com/
          grep -q '瑪菲斯皮膚覆蓋專家' /tmp/ycaura-home.html

      - name: Validate public SEO/AEO output
        env:
          SEO_AEO_BASE_URL: https://ycaura.com
          SEO_AEO_REPORT_PATH: seo-aeo-report.json
        run: npm run validate:seo-aeo

      - name: Submit sitemap to Google Search Console
        if: steps.impact.outputs.needs_gsc_sitemap_submit == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          GSC_SITE_URL: sc-domain:ycaura.com
          GSC_SITEMAP_URL: https://ycaura.com/sitemap.xml
          GSC_REPORT_PATH: gsc-report.json
        run: npm run submit:gsc

      - name: Report skipped Google Search Console submission
        if: steps.impact.outputs.needs_gsc_sitemap_submit != 'true'
        run: |
          echo "GSC sitemap submission skipped: ${{ steps.impact.outputs.impact_reasons }}"

      - name: Submit updated URLs to IndexNow
        continue-on-error: true
        timeout-minutes: 2
        env:
          INDEXNOW_REPORT_PATH: indexnow-report.json
        run: npm run submit:indexnow

      - name: Publish SEO/AEO sync outcomes
        if: always()
        run: node scripts/write-seo-aeo-summary.mjs

      - name: Upload SEO/AEO deployment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-aeo-${{ github.sha }}
          path: |
            seo-aeo-impact.json
            seo-aeo-predeploy-report.json
            seo-aeo-report.json
            gsc-report.json
            indexnow-report.json
          if-no-files-found: ignore
